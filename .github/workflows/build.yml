# Build Lu-An Optimizer on Windows and (once approved) sign it with
# SignPath Foundation's free code signing for open-source projects.
#
# Setup needed in the GitHub repository (after SignPath approves the project):
#  - Secret SIGNPATH_API_TOKEN (SignPath API token)
#  - Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG
# Without those, the build still runs and uploads the unsigned .exe.
# The certificate is issued to SignPath Foundation, not to Lu-An.
name: Build and sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # GitHub no permite usar `secrets` directamente en un `if:`.
    # Se pasa a una variable de entorno y se prueba esa variable.
    env:
      HAS_SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig@v1 construye el nombre viejo del archivo
      # (zig-windows-x86_64-0.15.1.zip) y da 404: desde 0.14.1 el nombre
      # es zig-x86_64-windows-0.15.1.zip. Se descarga directo.
      - name: Setup Zig 0.15.1
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ziglang.org/download/0.15.1/zig-x86_64-windows-0.15.1.zip -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          Add-Content $env:GITHUB_PATH "$PWD\zig-x86_64-windows-0.15.1"
          zig version

      - name: Build resources
        run: zig rc resource.rc lu-an.res

      - name: Build LuAnOptimizer.exe
        run: >
          zig cc -target x86_64-windows-gnu -O2 -D_WIN32_WINNT=0x0601
          main.c lu-an.res -o LuAnOptimizer.exe
          -lcomctl32 -lgdi32 -luser32 -lkernel32 -liphlpapi -lws2_32
          -lgdiplus -lole32 -ladvapi32 -lwininet -lurlmon -lbcrypt
          -ldxgi -lwbemuuid -loleaut32 -Wl,--subsystem,windows

      - name: Copy manifest
        run: Copy-Item app.manifest LuAnOptimizer.exe.manifest

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LuAnOptimizer
          path: |
            LuAnOptimizer.exe
            LuAnOptimizer.exe.manifest

      - name: Sign with SignPath (free, open source)
        if: env.HAS_SIGNPATH_TOKEN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed

      - name: Upload signed artifact
        if: env.HAS_SIGNPATH_TOKEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LuAnOptimizer-signed
          path: ./signed
